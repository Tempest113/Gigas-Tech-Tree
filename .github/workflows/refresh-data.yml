# Weekly refresh of the Gigastructures dataset.
#
# Entirely self-contained: checks out the public Gigastructures repo with the
# default GITHUB_TOKEN; no upstream configuration, webhooks, or deploy keys.
#
# NOTE on scheduling: GitHub disables scheduled workflows in public repos
# after 60 days without repository activity, and commits made by the
# workflow's own GITHUB_TOKEN do NOT reset that clock. If the site stops
# updating, run this workflow manually (Actions → Refresh data → Run
# workflow), or push any commit. See README "Automation".

name: Refresh data

on:
  schedule:
    # Mondays 04:17 UTC — after typical weekend modding activity, odd minute
    # to avoid GitHub's on-the-hour congestion.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sparse-checkout Gigastructures (Master-Dev)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Pouchkinn-s-Gigastructures/Gigastructures
          ref: Master-Dev
          path: upstream
          sparse-checkout: |
            common/technology
            common/scripted_variables
            common/inline_scripts
            common/scripted_triggers
            common/ascension_perks
            localisation/english
            gfx/interface/icons/technologies
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install Pillow pytest

      - name: Set up Node
        # Must match deploy-pages.yml. The suite runs in both workflows and a
        # version skew means the refresh can reject data the deploy would
        # accept, or the reverse. pdxparse-test's cp1252 fallback is the
        # canary: it needs a full-ICU TextDecoder for windows-1252.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run parser test suite
        run: python -m pytest tools/tests/ -q

      - name: Keep the previous dataset for comparison
        run: cp data/gigas-*.json /tmp/previous-dataset.json || true

      - name: Record upstream commit
        id: upstream
        run: echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build dataset and icons
        run: |
          python tools/build_data.py \
            --mod-dir upstream \
            --out data --icons-out assets/icons \
            --commit "${{ steps.upstream.outputs.sha }}" \
            --vanilla data/vanilla-structural.json

      # The tech-count floor in build_data.py only catches a catastrophic
      # parse failure. Every regression this repo has actually hit kept the
      # count intact and changed the SHAPE of the data — 64 ascension-perk
      # markings vanished at 301 technologies. Compare against the dataset
      # that is already committed, and stop before pushing rather than
      # letting a deploy go red days later.
      - name: Regression check against committed dataset
        run: |
          python tools/check_regression.py \
            --old /tmp/previous-dataset.json \
            --new "$(ls data/gigas-*.json | head -1)" \
            --vanilla data/vanilla-structural.json

      # The JS suite is what actually caught every problem here: it composes
      # vanilla with the mod data the way the browser does, which the Python
      # tests never touch. Running it only at deploy time meant bad data was
      # already committed by the time anything complained.
      - name: Run browser-model test suite
        run: |
          npm install --no-fund --no-audit jsdom@24
          node tests/viewmodel-test.mjs
          node tests/pdxparse-test.mjs
          node tests/dom-smoke.mjs

      # Summarise counts for the run page.
      - name: Job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          f = sorted(glob.glob("data/gigas-*.json"))[-1]
          d = json.load(open(f))
          h = d["health"]; c = d["meta"]["counts"]
          print(f"## Refresh — upstream `${{ steps.upstream.outputs.sha }}`")
          print(f"- technologies: **{c['technologies']}**")
          print(f"- overrides: {c['overrides']} · cross-mod: {c['crossModGated']}")
          print(f"- dangling: {len(h['dangling'])} · cycles: {len(h['cycles'])}"
                f" · tier inversions: {len(h['tierInversions'])}"
                f" · missing loc: {len(h['missingLoc'])}")
          print(f"- parse errors: {len(d['meta']['parseErrors'])}")
          PY

      - name: Commit if changed
        run: |
          # Old dataset files are superseded by the new commit-named one.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch $(git ls-files 'data/gigas-*.json' | grep -v "$(ls data/gigas-*.json | head -1 | xargs basename)" || true) 2>/dev/null || true
          git add data assets/icons
          if git diff --cached --quiet --exit-code; then
            echo "No changes; skipping commit."
          else
            git commit -m "data: refresh from Gigastructures@${{ steps.upstream.outputs.sha }}"
            git push
          fi
