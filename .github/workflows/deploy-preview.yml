# Preview deploy, for the throwaway preview repo only.
#
# Deliberately has no test gate. The production workflow (deploy-pages.yml)
# keeps its gate: the live site must never publish untested data. A preview
# repo is the opposite case — it exists to be looked at on a phone, and a
# known-failing assertion in the committed data must not block that.
#
# Both workflows key off the repository name, so this one never runs on the
# production repo and deploy-pages.yml never runs on a preview. Nothing
# needs editing when the mobile branch is merged back.

name: Deploy Preview

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository != 'Tempest113/Gigas-Tech-Tree'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
