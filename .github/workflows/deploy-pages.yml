# Deploys the site to GitHub Pages. Independent from data refresh so a bad
# upstream commit cannot take the site down: refresh commits data, and this
# workflow only publishes if the tests (including the DOM smoke test against
# the committed data) pass.

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    # Production repo only. A preview fork publishes via deploy-preview.yml,
    # which has no test gate on purpose.
    if: github.repository == 'Tempest113/Gigas-Tech-Tree'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install Pillow pytest
      - name: Parser/build test suite
        run: python -m pytest tools/tests/ -q

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: DOM smoke test (boots the real page)
        run: |
          npm install --no-fund --no-audit jsdom@24
          node tests/viewmodel-test.mjs
          node tests/pdxparse-test.mjs
          node tests/dom-smoke.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
